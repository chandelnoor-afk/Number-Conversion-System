<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Conversion System</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Custom styles */
        .dropdown-menu {
            transition: opacity 0.3s ease;
        }
        .dropdown-menu.hidden {
            opacity: 
            pointer-events: none;
        }
        .dropdown-menu.visible {
            opacity: 1;
            pointer-events: auto;
        }

	body{
	
	background-image:url("https://image.freepik.com/free-vector/binary-code-background-blue-vector_88211-920.jpg")
	
	}
 
    </style>

	    <script>
        function goToPage(url) {
            window.location.href = url;
        }
    </script>


</head>
<body class="bg-gray-100 text-gray-900 flex flex-col items-center justify-center min-h-screen">

    <!-- Main container -->
    <div class="container mx-auto p-12 bg-white rounded-lg shadow-lg max-w-2xl text-center"> <!-- Changed max-w-lg to max-w-2xl -->
        <!-- Header -->
        <header class="mb-10">
            <h1 class="text-5xl font-bold text-indigo-600">Number Conversion System</h1>
            <p class="mt-3 text-xl text-gray-600">Choose an algorithm to get started</p>
        </header>

        <!-- Options Section -->
        <section>
          
            <button  onclick="document.location='booths.html' "id="booths" class="w-full bg-indigo-600 text-white py-4 rounded hover:bg-indigo-500 transition mb-5 text-lg">Booth's Algorithm</button>
            <a href="restoring.html">
            <button   id="division-algorithms" class="w-full bg-indigo-600 text-white py-4 rounded hover:bg-indigo-500 transition mb-5 text-lg">Division Algorithms</button></a>
            <a href="binary.html">
            <button   id="binary" class="w-full bg-indigo-600 text-white py-4 rounded hover:bg-indigo-500 transition text-lg">Binary Conversion</button></a>
        </section>
    </div>

    <!-- Division Algorithms Dropdown -->
    <div id="division-options" class="dropdown-menu hidden abs olute mt-2 bg-white rounded-lg shadow-lg w-64 z-10">
        <button id="restoring" class="w-full text-left py-3 px-5 hover:bg-indigo-100 transition text-lg">Restoring Division</button>
        <button id="non-restoring" class="w-full text-left py-3 px-5 hover:bg-indigo-100 transition text-lg">Non-Restoring Division</button>
    </div>

    <!-- JavaScript Logic -->
    <script>

        // Toggle Division Options
        document.getElementById("division-algorithms").addEventListener("click", function() {
            const divisionOptions = document.getElementById("division-options");
            divisionOptions.classList.toggle("hidden");
            divisionOptions.classList.toggle("visible");
        });

        // Booth's Algorithm
        document.getElementById("booths").addEventListener("click", function() {
            alert("You selected Booth's Algorithm.");
            // Redirect to Booth's Algorithm page or function
        });

        // Restoring Division
        document.getElementById("restoring").addEventListener("click", function() {
            alert("You selected Restoring Division.");
            // Redirect to Restoring Division page or function
        });

        // Non-Restoring Division
        document.getElementById("non-restoring").addEventListener("click", function() {
            alert("You selected Non-Restoring Division.");
            // Redirect to Non-Restoring Division page or function
        });

        // Binary Conversion
        document.getElementById("binary").addEventListener("click", function() {
            alert("You selected Binary Conversion.");
            // Redirect to Binary Conversion page or function
        });
    </script>
</body>
</html>
